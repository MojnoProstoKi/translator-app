name: CI

on:
  pull_request:
  push:
    branches: [main]

# Both packages declare `swift-tools-version: 6.2` and `platforms: [.macOS(.v26)]`, so they need
# the macOS 26 SDK (Xcode 26) — the macos-26 image's default Xcode satisfies this.
jobs:
  translation-engine:
    name: TranslationEngine (build + test)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
      # Non-blocking for now: the existing sources predate the strict lint config and still have
      # line-length/line-break violations. Drop `continue-on-error` once they're cleaned up.
      - name: swift-format lint
        continue-on-error: true
        run: |
          cd Packages/TranslationEngine
          swift format lint --recursive --strict Sources Tests
      - name: Build
        run: |
          cd Packages/TranslationEngine
          swift build
      - name: Unit + contract tests
        run: |
          cd Packages/TranslationEngine
          swift test --filter TranslationEngineTests
      # NOTE: TranslationEngineIntegrationTests deliberately excluded from CI, and
      # TranslateCLIContractTests skips itself unless RUN_LIVE_TESTS=1.
      # They exercise real on-device SpeechAnalyzer/TranslationSession, which require
      # interactive TCC permission grants and are not runnable on headless CI runners.
      # Run them locally: `RUN_LIVE_TESTS=1 swift test`.

  app:
    name: RealtimeTranslator app (build + unit tests)
    runs-on: macos-26
    timeout-minutes: 20
    needs: translation-engine
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cd App
          swift build
      - name: Unit tests
        run: |
          cd App
          swift test
